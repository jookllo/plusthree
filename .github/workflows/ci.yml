name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests and audits
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plusthree_testing
          MYSQL_USER: plusthree
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: plusthree_testing
      DB_USERNAME: plusthree
      DB_PASSWORD: secret

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, zip, bcmath, gd, exif
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          # Another MySQL runs on 3307 locally; the service container is on 3306.
          sed -i "s|^DB_HOST=.*|DB_HOST=${DB_HOST}|" .env
          sed -i "s|^DB_PORT=.*|DB_PORT=${DB_PORT}|" .env
          sed -i "s|^DB_USERNAME=.*|DB_USERNAME=${DB_USERNAME}|" .env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=${DB_PASSWORD}|" .env
          php artisan key:generate --force

      - name: Show connection target
        run: php artisan tinker --execute="echo config('database.connections.mysql.host').':'.config('database.connections.mysql.port');"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm build

      - name: Run tests
        run: php artisan test

      - name: Audit PHP dependencies
        run: composer audit --no-interaction

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

  image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --progress=plain -t plusthree:ci .

      - name: Confirm GD can read JPEG and WebP
        run: |
          docker run --rm plusthree:ci php -r '
            $info = gd_info();
            printf("JPEG=%s WebP=%s\n", $info["JPEG Support"] ? "yes" : "no", $info["WebP Support"] ? "yes" : "no");
            exit($info["JPEG Support"] && $info["WebP Support"] ? 0 : 1);
          '
